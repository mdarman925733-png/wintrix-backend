name: Build Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/app/ishqana-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Remove local aapt2 override for CI
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Generate app icons from single source image
        run: |
          SRC="app/icon-source.png"
          if [ ! -f "$SRC" ]; then
            echo "icon-source.png not found, skipping icon generation"
            exit 0
          fi

          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )

          for density in "${!sizes[@]}"; do
            size=${sizes[$density]}
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"

            echo "Generating $density ($size x $size)"
            convert "$SRC" -resize ${size}x${size} "$dir/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert "$SRC" -resize ${size}x${size} "$dir/ic_launcher_foreground.png"
          done

          echo "All icon sizes generated successfully"

      - name: Build Release Bundle
        run: |
          ./gradlew :app:bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/ishqana-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.signing.store.type=jks

      - name: Print merged manifest (verify permissions)
        continue-on-error: true
        run: |
          echo "----- Searching for merged AndroidManifest.xml -----"
          MANIFEST=$(find app/build -path "*merged_manifest*/AndroidManifest.xml" -o -path "*merged_manifests*/release/AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build -name "AndroidManifest.xml" | grep -i release | head -n 1)
          fi
          echo "Found manifest at: $MANIFEST"
          if [ -z "$MANIFEST" ]; then
            echo "No merged manifest found anywhere under app/build"
            find app/build -name "AndroidManifest.xml"
            exit 0
          fi
          echo "----- MANIFEST CONTENT -----"
          cat "$MANIFEST"
          echo "-----------------------------"
          echo "Checking for FOREGROUND_SERVICE_MEDIA_PROJECTION..."
          grep -i "FOREGROUND_SERVICE_MEDIA_PROJECTION" "$MANIFEST" && echo "STILL PRESENT" || echo "NOT FOUND - permission successfully removed"
          echo "$MANIFEST" > /tmp/manifest_path.txt

      - name: Upload merged manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest
          path: app/build/**/AndroidManifest.xml
          if-no-files-found: warn

      - name: Decode full manifest with aapt2 (catches binary/compiled attributes)
        continue-on-error: true
        run: |
          echo "----- Locating AAB -----"
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "Using AAB: $AAB_PATH"
          if [ -z "$AAB_PATH" ]; then
            echo "No AAB found, skipping decode step"
            exit 0
          fi

          echo "----- Downloading bundletool -----"
          curl -sL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar

          echo "----- Building universal APK from AAB -----"
          java -jar bundletool.jar build-apks \
            --bundle="$AAB_PATH" \
            --output=out.apks \
            --mode=universal \
            --ks=$GITHUB_WORKSPACE/app/ishqana-release.jks \
            --ks-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }} \
            --overwrite

          echo "----- Extracting universal.apk -----"
          unzip -o out.apks -d apks_extracted

          echo "----- Locating aapt2 -----"
          AAPT2=$(find "$ANDROID_HOME" -name "aapt2" -type f 2>/dev/null | head -n 1)
          echo "Using aapt2: $AAPT2"
          if [ -z "$AAPT2" ]; then
            echo "aapt2 not found under ANDROID_HOME, skipping decode"
            exit 0
          fi

          echo "----- Dumping fully decoded manifest -----"
          "$AAPT2" dump xmltree apks_extracted/universal.apk --file AndroidManifest.xml > decoded_manifest.txt

          echo "===== SEARCH RESULT ====="
          grep -i "foregroundServiceType\|MEDIA_PROJECTION" decoded_manifest.txt && echo "STILL PRESENT (binary-level)" || echo "GENUINELY NOT FOUND - Play Console side issue confirmed"

      - name: Upload decoded manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoded-manifest
          path: decoded_manifest.txt
          if-no-files-found: warn

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
